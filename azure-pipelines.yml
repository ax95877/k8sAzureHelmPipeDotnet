trigger:
  branches:
    include:
      - main

variables:
  # Azure Service Connections (configured under Project Settings > Service Connections in ADO)
  dockerRegistryServiceConnection: 'acr-service-connection'  # Name of your ACR Docker Registry service connection
  azureSubscriptionEndpoint: 'aks-service-connection'        # Name of your Azure Resource Manager service connection

  # ACR Configuration
  acrLoginServer: 'ax888acr.azurecr.io'                         # Your ACR login server (e.g. <name>.azurecr.io)
  imageRepository: 'k8s-app'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

  # AKS Configuration
  azureResourceGroup: 'my-aks-rg'                            # Azure Resource Group containing the AKS cluster
  kubernetesCluster: 'my-aks-cluster'                        # AKS Cluster name
  k8sNamespace: 'default'                                    # Target Kubernetes namespace

  # Helm Configuration
  chartPath: '$(Build.SourcesDirectory)/charts/k8s-app'
  releaseName: 'k8s-app'

  # Agent VM image
  vmImageName: 'ubuntu-latest'

stages:
  # ============================================================================
  # Stage 1: Build & Push Docker Image to Azure Container Registry (ACR)
  # ============================================================================
  - stage: BuildAndPush
    displayName: 'Build & Push to ACR'
    jobs:
      - job: Build
        displayName: 'Build and Push Docker Image'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: 'Build and Push Docker image'
            inputs:
              command: 'buildAndPush'
              repository: '$(imageRepository)'
              dockerfile: '$(dockerfilePath)'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              tags: |
                $(tag)
                latest

  # ============================================================================
  # Stage 2: Deploy Helm Chart to Azure Kubernetes Service (AKS)
  # ============================================================================
  - stage: DeployToAKS
    displayName: 'Deploy to AKS via Helm'
    dependsOn: BuildAndPush
    condition: succeeded()
    jobs:
      - deployment: Deploy
        displayName: 'Deploy Helm release'
        pool:
          vmImage: $(vmImageName)
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: HelmInstaller@1
                  displayName: 'Install Helm'
                  inputs:
                    helmVersionToInstall: 'latest'

                # Using AzureCLI@2 with 'az aks get-credentials' guarantees compatibility
                # with Azure Entra ID / kubelogin and modern AKS clusters.
                - task: AzureCLI@2
                  displayName: 'Deploy Helm chart to AKS'
                  inputs:
                    azureSubscription: '$(azureSubscriptionEndpoint)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -e
                      echo "Fetching credentials for AKS cluster: $(kubernetesCluster)..."
                      az aks get-credentials \
                        --resource-group "$(azureResourceGroup)" \
                        --name "$(kubernetesCluster)" \
                        --overwrite-existing

                      echo "Upgrading / Installing Helm release: $(releaseName)..."
                      helm upgrade --install $(releaseName) $(chartPath) \
                        --namespace "$(k8sNamespace)" \
                        --create-namespace \
                        --set image.repository="$(acrLoginServer)/$(imageRepository)" \
                        --set image.tag="$(tag)" \
                        --wait \
                        --timeout 5m || {
                          echo "=== Helm failed! Inspecting Pod status and events ==="
                          kubectl get pods -n "$(k8sNamespace)"
                          kubectl describe pods -n "$(k8sNamespace)" -l app.kubernetes.io/instance=$(releaseName)
                          exit 1
                        }

                      echo "=== Deployment Succeeded! Fetching Service & External IP ==="
                      kubectl get svc -n "$(k8sNamespace)"
  
